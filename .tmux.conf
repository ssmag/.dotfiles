# split panes using | and -
set-option -g default-shell /bin/bash
bind \\ split-window -h
bind - split-window -v
unbind '"'
unbind %

# allow scrolling
set -g mouse on

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# switch panes using Alt-arrow without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# enable hyperlinks
set -as terminal-features ",*:hyperlinks"
set -g allow-passthrough on

# vi copy mode
set-window-option -g mode-keys vi
bind-key '`' copy-mode -e
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
unbind -T copy-mode-vi MouseDragEnd1Pane


# quality of life
set -g base-index 1
set -g pane-base-index 1
set -s escape-time 0
set -g history-limit 50000
set -g renumber-windows on

# pane tricks
# prefix + z   — zoom/unzoom pane (built-in)
# prefix + !   — break pane into its own window (built-in)
# prefix + space — cycle pane layouts (built-in)
# prefix + ,     — rename window (built-in)
bind S setw synchronize-panes

# plugins
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# auto-restore last saved session on tmux start
set -g @continuum-restore 'on'

# initialize TPM (keep at bottom)
run '/opt/homebrew/opt/tpm/share/tpm/tpm'
